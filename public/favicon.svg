<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    GizzyFx favicon — matches the new logo:
      neon green  #39FF14 (FX text, arrow, bullish candles)
      chrome      #C0C0C0 (Gizzy text, metallic shapes)
      red         #FF0000 (bearish candles)
      field       #0a0a0a (dark background)
  -->
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#39FF14"/>
      <stop offset="100%" stop-color="#00CC00"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#C0C0C0"/>
      <stop offset="100%" stop-color="#808080"/>
    </linearGradient>
  </defs>

  <!-- Dark field -->
  <rect width="100" height="100" rx="20" fill="#0a0a0a"/>

  <!-- Candlestick cluster -->
  <g>
    <!-- Bearish candle (red) -->
    <rect x="18" y="55" width="8" height="20" rx="1" fill="#FF0000"/>
    <line x1="22" y1="48" x2="22" y2="55" stroke="#FF0000" stroke-width="1.5"/>
    <line x1="22" y1="75" x2="22" y2="82" stroke="#FF0000" stroke-width="1.5"/>

    <!-- Bullish candle (green) -->
    <rect x="32" y="40" width="8" height="28" rx="1" fill="url(#green)"/>
    <line x1="36" y1="33" x2="36" y2="40" stroke="#39FF14" stroke-width="1.5"/>
    <line x1="36" y1="68" x2="36" y2="75" stroke="#39FF14" stroke-width="1.5"/>

    <!-- Bullish candle (green) -->
    <rect x="46" y="28" width="8" height="32" rx="1" fill="url(#green)"/>
    <line x1="50" y1="22" x2="50" y2="28" stroke="#39FF14" stroke-width="1.5"/>
    <line x1="50" y1="60" x2="50" y2="68" stroke="#39FF14" stroke-width="1.5"/>

    <!-- Bearish candle (red) -->
    <rect x="60" y="45" width="8" height="22" rx="1" fill="#FF0000"/>
    <line x1="64" y1="38" x2="64" y2="45" stroke="#FF0000" stroke-width="1.5"/>
    <line x1="64" y1="67" x2="64" y2="74" stroke="#FF0000" stroke-width="1.5"/>

    <!-- Bullish candle (green) -->
    <rect x="74" y="35" width="8" height="26" rx="1" fill="url(#green)"/>
    <line x1="78" y1="28" x2="78" y2="35" stroke="#39FF14" stroke-width="1.5"/>
    <line x1="78" y1="61" x2="78" y2="68" stroke="#39FF14" stroke-width="1.5"/>
  </g>

  <!-- Upward arrow (neon green) -->
  <path d="M15 88 L50 55 L85 88" stroke="url(#green)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M78 72 L88 88 L72 88 Z" fill="#39FF14"/>
</svg>
