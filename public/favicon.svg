<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    GizzyFx favicon. Standalone file (no page CSS available), so colours are
    literal here and match the default "Terminal" cyan palette:
      accent    oklch(0.800 0.135 196)  ~ #4fd6e8
      highlight oklch(0.868 0.140 182)  ~ #62eddb
      profit    oklch(0.735 0.185 148)  ~ #22c07a
      loss      oklch(0.640 0.222 25)   ~ #e0433c
      field     oklch(0.038 0.006 220)  ~ #05070a
    Shapes are deliberately heavy so they survive rasterisation at 16px.
  -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#62eddb"/>
      <stop offset="55%" stop-color="#4fd6e8"/>
      <stop offset="100%" stop-color="#1d7c8c"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#2f9fb3"/>
      <stop offset="100%" stop-color="#62eddb"/>
    </linearGradient>
  </defs>

  <!-- Instrument face + precision bezel -->
  <circle cx="50" cy="50" r="48" fill="#05070a"/>
  <circle cx="50" cy="50" r="45" stroke="url(#ring)" stroke-width="6" fill="none"/>

  <!-- Candles: bold blocks, readable at favicon scale -->
  <rect x="25" y="45" width="10" height="23" rx="1" fill="#22c07a"/>
  <rect x="39" y="33" width="10" height="31" rx="1" fill="#e0433c"/>
  <rect x="53" y="27" width="10" height="34" rx="1" fill="#22c07a"/>
  <rect x="67" y="38" width="10" height="24" rx="1" fill="#e0433c"/>

  <!-- Trend sweep -->
  <path d="M20 78 C 42 78, 60 70, 76 42"
        stroke="url(#sweep)" stroke-width="6" stroke-linecap="round" fill="none"/>
</svg>
